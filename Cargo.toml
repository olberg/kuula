[workspace]
resolver = "2"
members = [
    "crates/kuula-core",
    "crates/kuula-lua",
    "crates/kuula-host-sdl",
    "crates/kuula-host-headless",
    "crates/kuula-cli",
    "crates/kuula-mcp",
    "crates/kuula-net",
    "crates/kuula-apidoc",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Olli Sikstus"]

[workspace.dependencies]
kuula-core = { path = "crates/kuula-core" }
kuula-lua = { path = "crates/kuula-lua" }
kuula-host-sdl = { path = "crates/kuula-host-sdl" }
kuula-host-headless = { path = "crates/kuula-host-headless" }
kuula-mcp = { path = "crates/kuula-mcp" }
mlua = { version = "0.12", features = ["lua55", "vendored"] }
# The features are chosen per target in crates/kuula-host-sdl/Cargo.toml:
# the bundled static SDL 2.26 on Windows, the system SDL2 elsewhere.
sdl2 = { version = "0.38", default-features = false }
clap = { version = "4", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Pure Rust zip: stored and deflate entries through flate2's miniz_oxide
# backend, which png already pulls in. No encryption, no other codecs.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

# A copy of mlua-sys 0.12.0 with one change: `luaL_makeseed` always takes
# the C path, so the string-hash seed pinned in `.cargo/config.toml` holds
# on Linux and macOS too (the stock crate seeds those from the OS RNG).
# See crates/vendor/mlua-sys/src/lua55/lauxlib.rs and docs/docker.md.
[patch.crates-io]
mlua-sys = { path = "crates/vendor/mlua-sys" }
