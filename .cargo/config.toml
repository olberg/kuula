# SDL2 (through sdl2-sys `bundled`) declares cmake_minimum_required 3.0,
# which CMake 4 refuses. This tells CMake to configure anyway.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# Lua seeds every state's string hash from the wall clock and a stack
# address (luaL_makeseed in lauxlib.c), so `pairs` order over string keys
# would differ between runs. lauxlib.c only defines its own luai_makeseed
# when the macro is unset; this fixes the seed at 0 for the vendored build.
# cl.exe's /D cannot define a function-like macro, so the replacement is
# written such that `luai_makeseed()` expands to the constant expression
# `0u*sizeof !luaL_newstate()`, whose call is never evaluated.
#
# LUA_USER_H makes lua.h include crates/kuula-lua/c/kuula_user.h, which
# routes the float `^` operator and NaN printing through kuula-lua (the
# numeric profile). The value carries its own double
# quotes so it is an #include "..." string (cc splits CFLAGS on
# whitespace only, so they need no further quoting). INCLUDE (cl) and CPATH (gcc,
# clang) add the header's directory, relative to this repository; cc
# prepends the toolchain's own paths to INCLUDE. Cargo does not replace
# an INCLUDE that is already set, so from a Visual Studio developer
# prompt the Lua build fails with "cannot open include file
# 'kuula_user.h'" rather than building without the hooks.
CFLAGS = "-Dluai_makeseed=0u*sizeof!luaL_newstate -DLUA_USER_H=\"kuula_user.h\""
INCLUDE = { value = "crates/kuula-lua/c", relative = true }
CPATH = { value = "crates/kuula-lua/c", relative = true }

# The Miyoo Mini (Plus) build, `handheld/miyoo/Dockerfile`: a Cortex-A7 with
# VFPv4 and NEON, glibc 2.28. cc reads CFLAGS_<target> instead of CFLAGS
# when it is set, so this line repeats the seed pin and the numeric-profile
# header above. `-ffp-contract=off` keeps Lua's `a*b+c` from becoming one
# fused multiply-add, which x86-64 does not do; `-mfpu=vfpv4` without NEON
# keeps GCC from vectorising float code, whose flush-to-zero is not IEEE.
CFLAGS_armv7_unknown_linux_gnueabihf = "-Dluai_makeseed=0u*sizeof!luaL_newstate -DLUA_USER_H=\"kuula_user.h\" -march=armv7-a -mfpu=vfpv4 -mfloat-abi=hard -mtune=cortex-a7 -ffp-contract=off"

# The Android build, `handheld/android/Dockerfile`: the NDK's clang for each
# ABI, which `cc` reads CFLAGS_<target> for instead of CFLAGS, so each line
# repeats the seed pin and the numeric-profile header above, and
# `-ffp-contract=off` for the same reason as on the Miyoo (clang fuses
# `a*b+c` by default on aarch64). No -march or -mfpu: the NDK's own
# defaults are the ones Rust's Android targets use. cargo-ndk reads the
# environment, not this file, so the Dockerfile exports these values from
# here before it runs.
CFLAGS_aarch64_linux_android = "-Dluai_makeseed=0u*sizeof!luaL_newstate -DLUA_USER_H=\"kuula_user.h\" -ffp-contract=off"
CFLAGS_armv7_linux_androideabi = "-Dluai_makeseed=0u*sizeof!luaL_newstate -DLUA_USER_H=\"kuula_user.h\" -ffp-contract=off"
CFLAGS_x86_64_linux_android = "-Dluai_makeseed=0u*sizeof!luaL_newstate -DLUA_USER_H=\"kuula_user.h\" -ffp-contract=off"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

# The 32-bit Android build is linked for 4 KB pages by default, which is
# right for the 32-bit devices there are. The other two ABIs are linked for
# 16 KB by the NDK; this makes the third the same, so the package's check
# (every library's load segments aligned to 16 KB) has one rule.
[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
