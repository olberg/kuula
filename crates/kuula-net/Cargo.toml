[package]
name = "kuula-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side Iroh endpoint for Kuula: the runtime, the endpoint and the play protocol."

[dependencies]
# The transport implements the core's `net::Transport`; the core never
# depends on this crate.
kuula-core.workspace = true
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[target.'cfg(windows)'.dev-dependencies]
# The lifecycle test counts this process's threads.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
