[package]
name = "kuula-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kuula command line."

[[bin]]
name = "kuula"
path = "src/main.rs"

[features]
default = ["net"]
# Iroh networking: `--net`, the shell's network screens, `kuula net`,
# `net_sim --loopback` and the MCP `net` argument. Build the handheld
# binary with `--no-default-features`.
net = ["dep:kuula-net"]

[dependencies]
kuula-core.workspace = true
kuula-lua.workspace = true
kuula-host-sdl.workspace = true
kuula-host-headless.workspace = true
# What every host that runs the shell shares: the cart listing, the
# settings file, and the lines a host logs about a cart it was started on,
# which `kuula deploy` reads from an Android device over adb.
kuula-host-common.workspace = true
kuula-mcp.workspace = true
# Host-owned cart transport and diagnostics. Optional so the handheld
# build carries no tokio, QUIC or TLS.
kuula-net = { path = "../kuula-net", optional = true }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
png.workspace = true

[build-dependencies]
# Embeds assets/branding/kuula.ico into kuula.exe (build.rs).
tauri-winres = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
