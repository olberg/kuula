org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false
# The package has no code (hasCode is false in the manifest). Without these
# the plugin adds Kotlin's standard library, and with it dex files and
# Kotlin metadata that nothing will ever load.
android.builtInKotlin=false
kotlin.stdlib.default.dependency=false
