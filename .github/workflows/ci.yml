name: CI

# Builds the tree and runs its tests on clean Linux and Windows machines:
# the same commands a release is checked with, on two operating systems,
# so the claim that a run is the same everywhere is tried on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain the tree is developed and released with.
  RUST_VERSION: "1.98.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Windows builds the SDL2 that the sdl2 crate bundles; everywhere
      # else the system's is linked.
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Test the workspace
        run: cargo test --workspace --locked --no-fail-fast

      # The build without networking, as a handheld gets it.
      - name: Test the CLI without networking
        run: cargo test -p kuula-cli --no-default-features --locked --no-fail-fast

      - name: Check the API reference against the bindings
        run: cargo run --quiet --locked -p kuula-apidoc -- --check
